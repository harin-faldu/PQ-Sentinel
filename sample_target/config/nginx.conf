server {
    listen 443 ssl;
    server_name api.quantumvault.local;

    ssl_certificate /etc/ssl/certs/api_server.pem;
    ssl_certificate_key /etc/ssl/certs/api_server.key;

    # Active deprecated TLS protocol (Should be detected as CRITICAL)
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;

    # Commented-out config line (AST Parser MUST IGNORE!):
    # # ssl_protocols TLSv1.0;
}
