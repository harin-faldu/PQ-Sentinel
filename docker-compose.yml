services:
  # =====================================================================
  # QuantumVault CBOM Go Backend (In-Memory / Zero-DB Mode)
  # =====================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qv-cbom-backend
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - ALLOW_ORIGINS=*
    volumes:
      # Mount sample testbed codebase for in-container fallback/tests
      - ./sample_target:/app/sample_target:ro
      - ./sample_target:/sample_target:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # =====================================================================
  # QuantumVault CBOM React Frontend Dashboard (Served via Nginx)
  # =====================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qv-cbom-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
